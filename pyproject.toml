[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "archsift"
version = "0.1.0"
description = "Evidence-calibrated selection of the minimum-sufficient architecture"
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
authors = [{ name = "ArchSift contributors" }]
keywords = ["architecture", "decision-support", "agentic-ai", "automation"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = [
  "jsonschema>=4.23",
  "PyYAML>=6.0.2",
]

[project.optional-dependencies]
dev = [
  "build>=1.2.2",
  "mypy>=1.15",
  "pytest>=8.3",
  # Verification only: ArchSift writes its own deterministic PPTX package, and
  # this independent reader proves the result opens as a real presentation.
  # It is never imported by the shipped package.
  "python-pptx>=1.0.2",
  "ruff>=0.11",
  "types-jsonschema>=4.23",
  "types-PyYAML>=6.0.12",
]

[project.scripts]
archsift = "archsift.cli:main"

[project.urls]
Homepage = "https://github.com/maximalfocus/archsift"
Issues = "https://github.com/maximalfocus/archsift/issues"
Repository = "https://github.com/maximalfocus/archsift"

[tool.hatch.build.targets.wheel]
packages = ["src/archsift"]

[tool.hatch.build.targets.sdist]
exclude = [
  "graphify-out/**",
  "dist/**",
]

[tool.hatch.build.targets.wheel.force-include]
"docs/exit-codes.md" = "archsift/docs/exit-codes.md"
"docs/architecture-knowledge-v1.md" = "archsift/docs/architecture-knowledge-v1.md"
"docs/graph-snapshot-v1.md" = "archsift/docs/graph-snapshot-v1.md"
"docs/graph-change-v1.md" = "archsift/docs/graph-change-v1.md"
"docs/method-v1.0.0.md" = "archsift/docs/method-v1.0.0.md"
"docs/usage.md" = "archsift/docs/usage.md"
"docs/method-v1.1.0.md" = "archsift/docs/method-v1.1.0.md"
"docs/method-v1.2.0.md" = "archsift/docs/method-v1.2.0.md"
"docs/method-review-v1.md" = "archsift/docs/method-review-v1.md"
"docs/method-review-v2.md" = "archsift/docs/method-review-v2.md"
"docs/usability-check-v1.md" = "archsift/docs/usability-check-v1.md"
"docs/usability-check-v2.md" = "archsift/docs/usability-check-v2.md"

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["B", "E", "F", "I", "RUF", "SIM", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
files = ["src"]
