name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install project and development tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run tests without network-dependent behavior
        run: python -m pytest

      - name: Enforce NFR-005 large-dossier performance budget
        run: python -m benchmarks.large_dossier --max-seconds 2.0

      - name: Lint
        run: python -m ruff check .

      - name: Check formatting
        run: python -m ruff format --check .

      - name: Type-check
        run: python -m mypy src benchmarks tests/test_performance.py

      - name: Build distribution
        run: python -m build

      - name: Verify pure-Python wheel and packaged assets
        shell: python
        run: |
          from pathlib import Path
          from zipfile import ZipFile
          wheels = list(Path("dist").glob("*.whl"))
          assert len(wheels) == 1, wheels
          wheel = wheels[0]
          assert wheel.name.endswith("-py3-none-any.whl"), wheel
          with ZipFile(wheel) as archive:
              names = set(archive.namelist())
          assert "archsift/artefacts.py" in names
          assert "archsift/canonical.py" in names
          assert "archsift/decision.py" in names
          assert "archsift/decision_record.py" in names
          assert "archsift/markdown_report.py" in names
          assert "archsift/method.py" in names
          assert "archsift/method_review.py" in names
          assert "archsift/persistence.py" in names
          assert "archsift/rules.py" in names
          assert "archsift/usability.py" in names
          assert "archsift/docs/exit-codes.md" in names
          assert "archsift/docs/method-v1.0.0.md" in names
          assert "archsift/docs/method-v1.1.0.md" in names
          assert "archsift/docs/method-v1.2.0.md" in names
          assert "archsift/docs/method-review-v1.md" in names
          assert "archsift/docs/usability-check-v1.md" in names
          assert "archsift/schemas/dossier-v1.schema.json" in names
          assert "archsift/schemas/method-review-results-v1.schema.json" in names
          assert "archsift/schemas/usability-results-v1.schema.json" in names
          assert "archsift/templates/workspace-README.md" in names
          print(wheel)

      - name: Smoke-test installed wheel
        shell: python
        run: |
          import json
          import os
          import shutil
          import subprocess
          import sys
          import tempfile
          import venv
          from pathlib import Path
          from archsift import package_version
          from archsift.artefacts import evidence_artefact_identities
          from archsift.canonical import (
              canonical_dossier_bytes,
              dossier_content_identity,
              evidence_content_identities,
          )
          from archsift.decision import evaluate_assessment
          from archsift.decision_record import (
              canonical_decision_record_bytes,
              compose_decision_record,
          )
          from archsift.markdown_report import render_markdown_decision_report
          from archsift.validation import validate_workspace
          wheel = next(Path("dist").glob("*.whl")).resolve()
          root = Path(tempfile.mkdtemp())
          environment = root / "venv"
          venv.EnvBuilder(with_pip=True).create(environment)
          bindir = environment / ("Scripts" if os.name == "nt" else "bin")
          python = bindir / ("python.exe" if os.name == "nt" else "python")
          archsift = bindir / ("archsift.exe" if os.name == "nt" else "archsift")
          subprocess.run([python, "-m", "pip", "install", wheel], check=True)
          first_rules = subprocess.run(
              [archsift, "rules", "--json"],
              check=True,
              capture_output=True,
              text=True,
          )
          second_rules = subprocess.run(
              [python, "-m", "archsift", "rules", "--json"],
              check=True,
              capture_output=True,
              text=True,
          )
          assert first_rules.stdout == second_rules.stdout
          rules_payload = json.loads(first_rules.stdout)
          assert rules_payload["ruleset_version"] == "1.8.0"
          assert rules_payload["method"]["version"] == "1.2.0"
          assert rules_payload["method"]["ruleset_version"] == "1.8.0"
          assert rules_payload["method"]["specification"] == "docs/method-v1.2.0.md"
          assert len(rules_payload["method"]["sources"]) == 6
          assert len(rules_payload["rules"]) == 65
          assert all(rule["rationale_id"].startswith("method-v1.2.0#") for rule in rules_payload["rules"])
          assert all(rule["source_ids"] for rule in rules_payload["rules"])
          effects = [rule["effect"] for rule in rules_payload["rules"]]
          assert effects.count("block") == 8
          assert effects.count("require-evidence") == 44
          assert effects.count("support-candidate") == 10
          assert effects.count("constrain-autonomy") == 1
          assert effects.count("non-decisive") == 2
          human_rules = subprocess.run(
              [archsift, "rules"],
              check=True,
              capture_output=True,
              text=True,
          )
          assert "method 1.2.0; docs/method-v1.2.0.md" in human_rules.stdout
          assert "Method: method-v1.2.0#" in human_rules.stdout
          assert " Sources: " in human_rules.stdout
          method_probe = subprocess.run(
              [
                  python,
                  "-c",
                  (
                      "from importlib.resources import files; "
                      "from archsift.method import METHOD_SPECIFICATION, METHOD_VERSION, "
                      "validate_method_catalog; "
                      "from archsift.rules import RULESET_VERSION, list_rules; "
                      "rules = list_rules(); "
                      "validate_method_catalog(RULESET_VERSION, tuple(r.id for r in rules)); "
                      "text = files('archsift').joinpath(METHOD_SPECIFICATION).read_text("
                      "encoding='utf-8'); "
                      "assert f'# ArchSift method specification {METHOD_VERSION}' in text; "
                      "assert all(r.rationale_id in text for r in rules); "
                      "print(METHOD_VERSION, METHOD_SPECIFICATION, len(rules))"
                  ),
              ],
              check=True,
              capture_output=True,
              text=True,
          )
          assert method_probe.stdout.strip() == "1.2.0 docs/method-v1.2.0.md 65"
          sessions = []
          for index in range(1, 6):
              passed = index <= 4
              sessions.append({
                  "participant_id": f"participant-{index:02d}",
                  "target_user_eligible": True,
                  "independent": True,
                  "environment": {
                      "operating_system": "windows" if os.name == "nt" else "linux",
                      "python_version": f"{sys.version_info.major}.{sys.version_info.minor}",
                      "install_mode": "built-wheel",
                  },
                  "milestones": {
                      "initialize": "pass",
                      "complete": "pass",
                      "validate": "pass",
                      "assess": "pass" if passed else "fail",
                  },
                  "maintainer_intervention": False,
                  "session_result": "pass" if passed else "fail",
                  "failure_reason": None if passed else "Assessment was not completed.",
              })
          usability_path = root / "usability-results.json"
          usability_path.write_text(json.dumps({
              "schema_version": 1,
              "protocol_version": "1.0.0",
              "archsift_version_or_commit": package_version(),
              "overall_result": "met",
              "sessions": sessions,
          }), encoding="utf-8")
          usability_run = subprocess.run(
              [archsift, "usability-results", usability_path],
              check=True,
              capture_output=True,
              text=True,
          )
          assert usability_run.stdout == (
              "Usability criterion met: 4 of 5 sessions passed (protocol 1.0.0)\n"
          )
          review_examples = []
          review_area_rules = {
              "problem-value": ("binding-outcome-met", "decision-observed"),
              "agency-necessity": (
                  "agentic-runtime-adaptation-supports-agency",
                  "agency-observed",
              ),
              "autonomy-permission": (
                  "mandatory-human-control-retained",
                  "autonomy-observed",
              ),
              "comparative-fit": ("binding-constraint-met", "decision-observed"),
          }
          for index, example_id in enumerate((
              "agentic-control",
              "fixed-workflow",
              "insufficient-evidence",
              "no-technology-change",
          ), start=1):
              review_examples.append({
                  "example_id": example_id,
                  "decision_record_identity": f"sha256:{index:064x}",
                  "decision_areas": [{
                      "decision_area": area,
                      "trace_outcome": "causal",
                      "rule_ids": [rule_id],
                      "evidence_ids": [evidence_id],
                      "candidate_ids": ["reviewed-candidate"],
                      "verdict_rule_id": "verdict-supported",
                  } for area, (rule_id, evidence_id) in review_area_rules.items()],
                  "example_result": "pass",
              })
          method_review_path = root / "method-review-results.json"
          method_review_path.write_text(json.dumps({
              "schema_version": 1,
              "protocol_version": "1.0.0",
              "archsift_version_or_commit": package_version(),
              "method_version": "1.2.0",
              "ruleset_version": "1.8.0",
              "corpus_version": "1.0.0",
              "reviewer": {
                  "reviewer_id": "reviewer-01",
                  "target_reviewer_eligible": True,
                  "independent": True,
                  "environment": {
                      "operating_system": "windows" if os.name == "nt" else "linux",
                      "python_version": f"{sys.version_info.major}.{sys.version_info.minor}",
                      "install_mode": "built-wheel",
                  },
              },
              "maintainer_intervention": False,
              "examples": review_examples,
              "disagreements": [],
              "overall_result": "met",
              "failure_reasons": [],
          }), encoding="utf-8")
          method_review_run = subprocess.run(
              [archsift, "method-review-results", method_review_path],
              check=True,
              capture_output=True,
              text=True,
          )
          assert method_review_run.stdout == (
              "Architecture-method review criterion met: 4 examples reviewed "
              "(protocol 1.0.0)\n"
          )
          case = root / "case"
          subprocess.run([archsift, "init", case], check=True)
          guidance = (case / "README.md").read_text(encoding="utf-8")
          assert "Markdown review view" in guidance
          assert "visibly quoted as inert data" in guidance
          assert "survives the agency rules only when" in guidance
          assert "non-decisive for agency necessity" in guidance
          assert "does not prove the external truth or operational adequacy" in guidance
          assert "does not prove global optimality, discover omitted alternatives" in guidance
          external_root = root / "external-evidence"
          external_root.mkdir()
          (case / "evidence" / "baseline.bin").write_bytes(b"installed baseline\x00")
          (external_root / "trial.bin").write_bytes(b"installed trial\xff")
          initialized = subprocess.run(
              [python, "-m", "archsift", "validate", case, "--json"],
              check=True,
              capture_output=True,
              text=True,
          )
          initialized_payload = json.loads(initialized.stdout)
          assert initialized_payload["assessment_prerequisites_ready"] is False
          assert initialized_payload["prerequisite_finding_count"] == 5
          assert initialized_payload["ruleset_version"] == "1.8.0"
          agency_yes = {
              "answer": "yes",
              "rationale": "A sanitised evidence-backed answer.",
              "evidence_ids": ["agency-estimate"],
          }
          agency_no = {**agency_yes, "answer": "no"}
          autonomy_yes = {
              "answer": "yes",
              "rationale": "A sanitised evidence-backed autonomy fact.",
              "evidence_ids": ["autonomy-observed"],
          }
          autonomy_no = {**autonomy_yes, "answer": "no"}
          dossier = {
              "schema_version": 1,
              "case": {"id": "installed", "title": "Installed wheel smoke"},
              "task": {
                  "operation": "Review one installed-wheel smoke case.",
                  "starts_when": "A smoke case is available.",
                  "completes_when": "The disposition is recorded.",
                  "accountable_owner": "Test owner",
                  "actors": ["Reviewer", "Approver"],
                  "systems_and_tools": [],
                  "information_read": ["Smoke case"],
                  "actions": [{
                      "id": "release-disposition",
                      "description": "Release the approved disposition.",
                      "consequential": True,
                      "approval_boundary": "An approver must approve before release.",
                  }],
                  "exclusions": ["Changing policy"],
              },
              "evidence": [{
                  "id": "baseline",
                  "kind": "observed",
                  "claim": "Current median handling time is 12 minutes.",
                  "owner": "Process analyst",
                  "affects": ["problem-value"],
                  "provenance": "sanitised measurement",
                  "observed_at": "2026-08-07",
                  "artefacts": [{
                      "id": "baseline-bytes",
                      "root": "workspace",
                      "path": "baseline.bin",
                  }],
              }, {
                  "id": "agency-estimate",
                  "kind": "estimate",
                  "claim": "A fixed workflow handles the bounded smoke case.",
                  "owner": "Engineering lead",
                  "affects": ["agency-necessity", "comparative-fit"],
                  "method": "Sanitised installed-wheel smoke fixture.",
                  "artefacts": [{
                      "id": "trial-bytes",
                      "root": "external",
                      "path": "trial.bin",
                  }],
              }, {
                  "id": "autonomy-observed",
                  "kind": "observed",
                  "claim": "Consequential release requires approval.",
                  "owner": "Risk reviewer",
                  "affects": ["autonomy-permission"],
                  "provenance": "sanitised control review",
                  "observed_at": "2026-08-07",
              }],
              "problem_value": {
                  "outcomes": [{
                      "id": "reduce-time",
                      "description": "Reduce handling time.",
                      "measure": "Median minutes per case",
                      "target": "At most 8 minutes",
                      "baseline_id": "current-time",
                      "binding": True,
                      "evidence_ids": ["baseline"],
                  }],
                  "baselines": [{
                      "id": "current-time",
                      "description": "Current handling time.",
                      "measure": "Median minutes per case",
                      "value": "12 minutes",
                      "evidence_ids": ["baseline"],
                  }],
                  "constraints": [],
                  "affected_volume": {"statement": "Material volume.", "evidence_ids": ["baseline"]},
                  "material_pain": {"statement": "Manual delay.", "evidence_ids": ["baseline"]},
                  "error_cost": {"statement": "Rework cost.", "evidence_ids": ["baseline"]},
                  "technology_limitation": {"statement": "Search delay.", "evidence_ids": ["baseline"]},
              },
              "agency_necessity": {
                  "execution_steps_predefinable": agency_yes,
                  "step_count_or_order_predictable": agency_yes,
                  "runtime_tool_choice_required": agency_no,
                  "runtime_replanning_required": agency_no,
                  "environmental_feedback_available": agency_yes,
                  "completion_independently_verifiable": agency_yes,
                  "effects_independently_verifiable": agency_yes,
                  "fixed_workflow_sufficient": agency_yes,
                  "residual_cases": [],
              },
              "autonomy_permission": {
                  "actions_reversible": autonomy_no,
                  "failure_blast_radius_bounded": autonomy_yes,
                  "regulatory_automation_permitted": autonomy_no,
                  "data_confidence_sufficient": autonomy_yes,
                  "accountable_owner_assigned": autonomy_yes,
                  "decision_path_auditable": autonomy_yes,
                  "timely_human_intervention_available": autonomy_yes,
                  "safe_degradation_available": autonomy_yes,
                  "hard_vetoes": [{
                      "id": "no-autonomous-release",
                      "status": "active",
                      "condition": "Release would occur without approval.",
                      "consequence": "Autonomous release is prohibited.",
                      "action_ids": ["release-disposition"],
                      "evidence_ids": ["autonomy-observed"],
                      "prohibited_control_classes": ["agentic-control"],
                  }],
                  "mandatory_human_controls": [{
                      "id": "approve-release",
                      "description": "Approve before release.",
                      "control_point": "Immediately before release.",
                      "responsible_role": "Approver",
                      "action_ids": ["release-disposition"],
                      "evidence_ids": ["autonomy-observed"],
                  }],
              },
              "decision_conditions": [{
                  "id": "verify-production-capacity",
                  "target_control_class": "fixed-ai-workflow",
                  "decision_area": "comparative-fit",
                  "statement": "Verify production capacity before adoption.",
                  "status": "unmet",
                  "resolved_by": "Run the named production-capacity test.",
                  "evidence_ids": ["agency-estimate"],
              }],
              "candidate_comparison": {
                  "candidates": [{
                      "id": "current-review",
                      "name": "Current review",
                      "description": "Human-owned review using current tools.",
                      "control_class": "human-owned-work",
                      "roles": ["current-baseline", "strongest-simpler"],
                      "material_deviations": [],
                      "outcome_tests": [{
                          "outcome_id": "reduce-time",
                          "result": "fails",
                          "rationale": "Current handling time exceeds the target.",
                          "evidence_ids": ["agency-estimate"],
                      }],
                      "constraint_tests": [],
                  }, {
                      "id": "fixed-workflow",
                      "name": "Fixed workflow",
                      "description": "Code controls the path while a model assists.",
                      "control_class": "fixed-ai-workflow",
                      "roles": ["proposed"],
                      "material_deviations": ["Release remains human-approved."],
                      "authority": {
                          "action_ids": ["release-disposition"],
                          "retained_human_control_ids": ["approve-release"],
                          "evidence_ids": ["autonomy-observed"],
                      },
                      "outcome_tests": [{
                          "outcome_id": "reduce-time",
                          "result": "meets",
                          "rationale": "The representative estimate meets the target.",
                          "evidence_ids": ["agency-estimate"],
                      }],
                      "constraint_tests": [],
                  }],
                  "strongest_simpler_boundary": {
                      "strongest_candidate_id": "current-review",
                      "scope": "All represented candidates below the fixed workflow.",
                      "rationale": "Current review is the strongest represented simpler option.",
                      "considered_candidate_ids": ["current-review"],
                      "evidence_ids": ["agency-estimate"],
                  },
                  "comparisons": [{
                      "subject_candidate_id": "fixed-workflow",
                      "comparator_candidate_id": "current-review",
                      "dimensions": {
                          name: {
                              "result": "better",
                              "rationale": "The estimate favors the fixed workflow.",
                              "evidence_ids": ["agency-estimate"],
                          }
                          for name in (
                              "outcome_quality",
                              "difficult_case_performance",
                              "cost",
                              "latency",
                              "human_effort",
                              "integration_burden",
                              "security_exposure",
                              "failure_impact",
                              "operability",
                              "evaluation_burden",
                              "maintainability",
                          )
                      },
                  }],
              },
          }
          (case / "case.yaml").write_text(json.dumps(dossier), encoding="utf-8")
          completed = subprocess.run(
              [python, "-m", "archsift", "validate", case, "--json"],
              check=True,
              capture_output=True,
              text=True,
          )
          payload = json.loads(completed.stdout)
          assert payload["problem_value_defined"] is True
          assert payload["problem_value_ready"] is True
          assert payload["outcome_count"] == 1
          assert payload["agency_necessity_defined"] is True
          assert payload["agency_necessity_ready"] is True
          assert payload["residual_case_count"] == 0
          assert payload["autonomy_permission_defined"] is True
          assert payload["autonomy_permission_ready"] is True
          assert payload["hard_veto_count"] == 1
          assert payload["mandatory_human_control_count"] == 1
          assert payload["candidate_comparison_defined"] is True
          assert payload["candidate_comparison_ready"] is True
          assert payload["candidate_count"] == 2
          assert payload["comparison_count"] == 1
          assert payload["assessment_prerequisites_ready"] is True
          assert payload["prerequisite_finding_count"] == 0
          assert payload["ruleset_version"] == "1.8.0"
          source_result = validate_workspace(case)
          assert source_result.dossier is not None
          source_dossier = source_result.dossier
          source_artefacts = evidence_artefact_identities(
              source_dossier,
              workspace=case,
              external_root=external_root,
          )
          source_record = compose_decision_record(
              source_dossier,
              tool_version="0.1.0-wheel-smoke",
              artefact_identities=source_artefacts,
          )
          source_snapshot = {
              "canonical_bytes": canonical_dossier_bytes(source_dossier).hex(),
              "decision_record": canonical_decision_record_bytes(source_record).hex(),
              "markdown_report": render_markdown_decision_report(source_record).hex(),
              "dossier_identity": dossier_content_identity(source_dossier),
              "artefact_identities": [item.to_dict() for item in source_artefacts],
              "evidence_identities": evidence_content_identities(source_dossier),
              "verdict": evaluate_assessment(source_dossier).verdict.value,
          }
          decision = subprocess.run(
              [
                  python,
                  "-c",
                  (
                      "import json; from dataclasses import replace; "
                      "from pathlib import Path; import sys; "
                      "from archsift.artefacts import evidence_artefact_identities; "
                      "from archsift.canonical import canonical_dossier_bytes, "
                      "dossier_content_identity, evidence_content_identities; "
                      "from archsift.decision import evaluate_assessment; "
                      "from archsift.decision_record import canonical_decision_record_bytes, "
                      "compose_decision_record; "
                      "from archsift.markdown_report import render_markdown_decision_report; "
                      "from archsift.validation import AgencyAnswer, CandidateRole, ControlClass, "
                      "HardVetoStatus, ResidualCase, validate_workspace; "
                      "dossier = validate_workspace(Path(sys.argv[1])).dossier; "
                      "assert dossier is not None; "
                      "result = evaluate_assessment(dossier); "
                      "artefacts = evidence_artefact_identities(dossier, "
                      "workspace=Path(sys.argv[1]), external_root=Path(sys.argv[2])); "
                      "record = compose_decision_record(dossier, "
                      "tool_version='0.1.0-wheel-smoke', artefact_identities=artefacts); "
                      "assert result.recommended_class.value == 'fixed-ai-workflow'; "
                      "assert result.active_hard_veto_ids == ('no-autonomous-release',); "
                      "assert result.mandatory_human_control_ids == ('approve-release',); "
                      "assert any(f.rule_id == 'mandatory-human-control-retained' "
                      "for f in result.ordered_elimination_evaluation.findings); "
                      "comparison = dossier.candidate_comparison; assert comparison is not None; "
                      "autonomy = dossier.autonomy_permission; assert autonomy is not None; "
                      "agentic_candidate = replace(comparison.candidates[1], "
                      "control_class=ControlClass.AGENTIC_CONTROL, "
                      "roles=(CandidateRole.PROPOSED, CandidateRole.AGENTIC_COMPARATOR)); "
                      "agentic_autonomy = replace(autonomy, hard_vetoes=(replace("
                      "autonomy.hard_vetoes[0], status=HardVetoStatus.INACTIVE),)); "
                      "agentic_dossier = replace(dossier, autonomy_permission=agentic_autonomy, "
                      "candidate_comparison=replace(comparison, "
                      "candidates=(comparison.candidates[0], agentic_candidate))); "
                      "blocked_agentic = evaluate_assessment(agentic_dossier); "
                      "assert any(c.candidate_id == 'fixed-workflow' and "
                      "c.disposition.value == 'eliminated' for c in "
                      "blocked_agentic.ordered_elimination_evaluation.candidates); "
                      "assert any(f.rule_id == "
                      "'agentic-fixed-workflow-sufficient-blocks-candidate' for f in "
                      "blocked_agentic.ordered_elimination_evaluation.findings); "
                      "agency = dossier.agency_necessity; assert agency is not None; "
                      "contradictory_agency = replace(agency, runtime_tool_choice_required=replace("
                      "agency.runtime_tool_choice_required, answer=AgencyAnswer.YES)); "
                      "contradictory_dossier = replace(dossier, "
                      "agency_necessity=contradictory_agency); "
                      "contradictory = evaluate_assessment(contradictory_dossier); "
                      "assert contradictory.verdict.value == 'insufficient-evidence'; "
                      "contradiction = next(f for f in "
                      "contradictory.prerequisite_evaluation.findings if f.rule_id == "
                      "'agency-necessity-contradiction'); "
                      "assert contradiction.counterpart == "
                      "'$.agency_necessity.runtime_tool_choice_required.answer'; "
                      "contradictory_record = compose_decision_record(contradictory_dossier, "
                      "tool_version='0.1.0-wheel-smoke', artefact_identities=artefacts); "
                      "assert 'agency-necessity-contradiction' in "
                      "render_markdown_decision_report(contradictory_record).decode('utf-8'); "
                      "supported_agency = replace(agency, "
                      "runtime_tool_choice_required=replace(agency.runtime_tool_choice_required, "
                      "answer=AgencyAnswer.YES), fixed_workflow_sufficient=replace("
                      "agency.fixed_workflow_sufficient, answer=AgencyAnswer.NO), "
                      "residual_cases=(ResidualCase('installed-residual', "
                      "'A sanitised installed-wheel residual case.', "
                      "'A fixed workflow cannot choose its next approved step.', "
                      "('agency-estimate',)),)); "
                      "supported_agentic = evaluate_assessment(replace(agentic_dossier, "
                      "agency_necessity=supported_agency)); "
                      "assert supported_agentic.recommended_class is ControlClass.AGENTIC_CONTROL; "
                      "assert supported_agentic.verdict.value == 'supported'; "
                      "assert any(f.rule_id == 'agentic-residual-case-supports-agency' for f in "
                      "supported_agentic.ordered_elimination_evaluation.findings); "
                      "blocked_veto = replace(autonomy.hard_vetoes[0], "
                      "prohibited_control_classes=(ControlClass.FIXED_AI_WORKFLOW,)); "
                      "blocked = replace(dossier, autonomy_permission=replace(autonomy, "
                      "hard_vetoes=(blocked_veto,))); blocked_result = evaluate_assessment(blocked); "
                      "assert blocked_result.verdict.value == 'no-permissible-candidate'; "
                      "assert any(f.rule_id == 'active-veto-blocks-candidate' "
                      "for f in blocked_result.ordered_elimination_evaluation.findings); "
                      "assert tuple(c.id for c in result.unmet_conditions) == "
                      "('verify-production-capacity',); "
                      "print(json.dumps({'canonical_bytes': canonical_dossier_bytes(dossier).hex(), "
                      "'artefact_identities': [item.to_dict() for item in artefacts], "
                      "'decision_record': canonical_decision_record_bytes(record).hex(), "
                      "'markdown_report': render_markdown_decision_report(record).hex(), "
                      "'dossier_identity': dossier_content_identity(dossier), "
                      "'evidence_identities': evidence_content_identities(dossier), "
                      "'verdict': result.verdict.value}, sort_keys=True))"
                  ),
                  str(case),
                  str(external_root),
              ],
              check=True,
              capture_output=True,
              text=True,
          )
          installed_snapshot = json.loads(decision.stdout)
          assert installed_snapshot == source_snapshot
          assert installed_snapshot["verdict"] == "conditional"
          source_assess = compose_decision_record(
              source_dossier,
              tool_version=package_version(),
              artefact_identities=source_artefacts,
          )
          source_assess_bytes = canonical_decision_record_bytes(source_assess)
          source_report_bytes = render_markdown_decision_report(source_assess)
          assess_command = [
              archsift,
              "assess",
              case,
              "--external-evidence-root",
              external_root,
              "--json",
          ]
          first_assess = subprocess.run(assess_command, check=True, capture_output=True)
          assert first_assess.stderr == b""
          assert first_assess.stdout == source_assess_bytes
          assess_payload = json.loads(first_assess.stdout)
          record_identity = assess_payload["record_content_identity"]
          record_path = case / "output" / f"sha256-{record_identity[7:]}.json"
          report_path = case / "output" / f"sha256-{record_identity[7:]}.md"
          assert record_path.read_bytes() == first_assess.stdout
          assert report_path.read_bytes() == source_report_bytes
          os.utime(record_path, (1_700_000_000, 1_700_000_000))
          os.utime(report_path, (1_700_000_000, 1_700_000_000))
          recorded_mtimes = (record_path.stat().st_mtime_ns, report_path.stat().st_mtime_ns)
          second_assess = subprocess.run(assess_command, check=True, capture_output=True)
          assert second_assess.stdout == first_assess.stdout
          assert second_assess.stderr == b""
          assert (record_path.stat().st_mtime_ns, report_path.stat().st_mtime_ns) == recorded_mtimes
          assert len(list((case / "output").glob("*.json"))) == 1
          assert len(list((case / "output").glob("*.md"))) == 1
          manifest = json.loads(Path("examples/manifest.json").read_text(encoding="utf-8"))
          installed_examples = root / "installed-examples"
          installed_examples.mkdir()
          network_blocker = root / "network-blocker"
          network_blocker.mkdir()
          (network_blocker / "sitecustomize.py").write_text(
              "import socket\n"
              "def blocked(*args, **kwargs):\n"
              "    raise AssertionError('example execution must remain offline')\n"
              "socket.create_connection = blocked\n"
              "socket.getaddrinfo = blocked\n"
              "socket.socket.connect = blocked\n"
              "socket.socket.connect_ex = blocked\n",
              encoding="utf-8",
          )
          offline_environment = os.environ.copy()
          offline_environment["PYTHONPATH"] = str(network_blocker)
          for example in manifest["examples"]:
              installed_example = installed_examples / example["path"]
              shutil.copytree(Path("examples") / example["path"], installed_example)
              validated = subprocess.run(
                  [archsift, "validate", installed_example, "--json"],
                  check=True,
                  capture_output=True,
                  env=offline_environment,
              )
              assert validated.stderr == b""
              assert json.loads(validated.stdout)["status"] == "valid"
              example_command = [archsift, "assess", installed_example, "--json"]
              first_example = subprocess.run(
                  example_command,
                  check=True,
                  capture_output=True,
                  env=offline_environment,
              )
              second_example = subprocess.run(
                  example_command,
                  check=True,
                  capture_output=True,
                  env=offline_environment,
              )
              assert first_example.stderr == second_example.stderr == b""
              assert first_example.stdout == second_example.stdout
              example_payload = json.loads(first_example.stdout)
              example_assessment = example_payload["assessment"]
              assert example_assessment["verdict"] == example["verdict"]
              assert example_assessment["recommended_class"] == example["recommended_class"]
              assert example_assessment["evidence_state"] == example["evidence_state"]
              example_findings = (
                  example_assessment["prerequisite_evaluation"]["findings"]
                  + example_assessment["ordered_elimination_evaluation"]["findings"]
              )
              representative = next(
                  finding
                  for finding in example_findings
                  if finding["rule_id"] == example["representative_rule_id"]
              )
              assert example["representative_evidence_id"] in representative["evidence_ids"]
              example_identity = example_payload["record_content_identity"][7:]
              example_record = installed_example / "output" / f"sha256-{example_identity}.json"
              assert example_record.read_bytes() == first_example.stdout
