name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install project and development tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Run tests without network-dependent behavior
        run: python -m pytest

      - name: Lint
        run: python -m ruff check .

      - name: Check formatting
        run: python -m ruff format --check .

      - name: Type-check
        run: python -m mypy src

      - name: Build distribution
        run: python -m build

      - name: Verify pure-Python wheel and packaged assets
        shell: python
        run: |
          from pathlib import Path
          from zipfile import ZipFile
          wheels = list(Path("dist").glob("*.whl"))
          assert len(wheels) == 1, wheels
          wheel = wheels[0]
          assert wheel.name.endswith("-py3-none-any.whl"), wheel
          with ZipFile(wheel) as archive:
              names = set(archive.namelist())
          assert "archsift/schemas/dossier-v1.schema.json" in names
          assert "archsift/templates/workspace-README.md" in names
          print(wheel)

      - name: Smoke-test installed wheel
        shell: python
        run: |
          import os
          import subprocess
          import tempfile
          import venv
          from pathlib import Path
          wheel = next(Path("dist").glob("*.whl")).resolve()
          root = Path(tempfile.mkdtemp())
          environment = root / "venv"
          venv.EnvBuilder(with_pip=True).create(environment)
          bindir = environment / ("Scripts" if os.name == "nt" else "bin")
          python = bindir / ("python.exe" if os.name == "nt" else "python")
          archsift = bindir / ("archsift.exe" if os.name == "nt" else "archsift")
          subprocess.run([python, "-m", "pip", "install", wheel], check=True)
          case = root / "case"
          subprocess.run([archsift, "init", case], check=True)
          subprocess.run([python, "-m", "archsift", "validate", case], check=True)
