name: Bug report
description: Report reproducible behavior that violates ArchSift's documented contract
title: "[Bug]: "
labels: [bug]
body:
  - type: checkboxes
    attributes:
      label: Preflight
      options:
        - label: I searched existing issues and found no duplicate.
          required: true
        - label: This report uses an independently authored synthetic reproduction and contains no actual case material or sanitised, paraphrased, transformed, or source-mapped derivative; no credentials, internal URLs, or proprietary policy text.
          required: true
  - type: input
    id: version
    attributes:
      label: ArchSift version or commit
      placeholder: 0.1.0 or commit SHA
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Provide independently authored synthetic inputs and exact commands.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Operating system and Python version.
    validations:
      required: true
