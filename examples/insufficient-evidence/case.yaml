schema_version: 1
case:
  id: insufficient-evidence
  title: Fictional decision with an unresolved comparison
language: en
evidence:
- id: decision-observed
  claim: Fictional trials have not established whether the fixed workflow meets the binding target.
  owner: Fictional evaluation team
  affects:
  - problem-value
  - comparative-fit
  artefacts:
  - id: fictional-observations
    root: workspace
    path: observations.txt
  kind: observed
  provenance: Fictional observations in evidence/observations.txt.
  observed_at: '2026-08-08'
- id: agency-observed
  claim: Fictional task observations show the task path can be predefined.
  owner: Fictional evaluation team
  affects:
  - agency-necessity
  artefacts:
  - id: fictional-observations
    root: workspace
    path: observations.txt
  kind: observed
  provenance: Fictional observations in evidence/observations.txt.
  observed_at: '2026-08-08'
- id: autonomy-observed
  claim: Fictional control observations bound preparation and retain accountable release.
  owner: Fictional evaluation team
  affects:
  - autonomy-permission
  artefacts:
  - id: fictional-observations
    root: workspace
    path: observations.txt
  kind: observed
  provenance: Fictional observations in evidence/observations.txt.
  observed_at: '2026-08-08'
task:
  operation: Review one bounded synthetic case.
  starts_when: A complete case arrives.
  completes_when: An approved disposition is recorded.
  accountable_owner: Fictional operations owner
  actors:
  - Reviewer
  - Approver
  systems_and_tools:
  - Case register
  information_read:
  - Synthetic case data
  actions:
  - id: prepare-disposition
    description: Prepare the bounded disposition.
    consequential: false
    approval_boundary: A reviewer remains responsible for the draft.
  - id: release-disposition
    description: Release the approved disposition.
    consequential: true
    approval_boundary: An approver must approve before release.
  exclusions:
  - Changing policy
problem_value:
  outcomes:
  - id: required-quality
    description: Meet required quality.
    measure: Accepted cases
    target: At least 95 percent
    baseline_id: current-quality
    binding: true
    evidence_ids:
    - decision-observed
  baselines:
  - id: current-quality
    description: Current result.
    measure: Accepted cases
    value: 90 percent
    evidence_ids:
    - decision-observed
  constraints:
  - id: approval-required
    description: Human approval is required.
    test: Check approval before release.
    required_result: Approval exists
    binding: true
    evidence_ids:
    - decision-observed
  affected_volume:
    statement: Material volume.
    evidence_ids:
    - decision-observed
  material_pain:
    statement: Material delay.
    evidence_ids:
    - decision-observed
  error_cost:
    statement: Material rework.
    evidence_ids:
    - decision-observed
  technology_limitation:
    statement: Current tooling limits retrieval.
    evidence_ids:
    - decision-observed
agency_necessity:
  execution_steps_predefinable:
    answer: 'yes'
    rationale: A fictional observation supports this agency fact.
    evidence_ids:
