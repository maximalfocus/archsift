  hard_vetoes:
  - id: human-release-required
    status: active
    condition: The fictional disposition would be released without approval.
    consequence: Release is prohibited until a fictional approver accepts it.
    action_ids:
    - release-disposition
    evidence_ids:
    - autonomy-observed
    prohibited_control_classes:
    - deterministic-automation
    - fixed-ai-workflow
    - agentic-control
  mandatory_human_controls:
  - id: approve-release
    description: Approve the fictional disposition before release.
    control_point: Immediately before release-disposition.
    responsible_role: Fictional approver
    action_ids:
    - release-disposition
    evidence_ids:
    - autonomy-observed
candidate_comparison:
  candidates:
  - id: human-review
    name: Fictional human review
    description: People follow the bounded review procedure using the existing register.
    control_class: human-owned-work
    roles:
    - current-baseline
    - strongest-simpler
    material_deviations: []
    outcome_tests:
    - outcome_id: required-quality
      result: fails
      rationale: The fictional observation remains below the binding quality target.
      evidence_ids:
      - decision-observed
    constraint_tests:
    - constraint_id: approval-required
      result: meets
      rationale: Synthetic approval-boundary result.
      evidence_ids:
      - decision-observed
  - id: fixed-workflow
    name: Fictional fixed AI workflow
    description: Code fixes the path while a model assists within the bounded preparation action.
    control_class: fixed-ai-workflow
    roles:
    - proposed
    material_deviations:
    - The fictional workflow adds maintained automation while retaining bounded authority.
    outcome_tests:
    - outcome_id: required-quality
      result: unknown
      rationale: The fictional trial has not established whether the target is met.
      evidence_ids:
      - decision-observed
    constraint_tests:
    - constraint_id: approval-required
      result: meets
      rationale: Synthetic approval-boundary result.
      evidence_ids:
      - decision-observed
    authority:
      action_ids:
      - prepare-disposition
      retained_human_control_ids: []
      evidence_ids:
      - autonomy-observed
  comparisons:
  - subject_candidate_id: fixed-workflow
    comparator_candidate_id: human-review
    dimensions:
      outcome_quality:
        result: unknown
        rationale: The fictional observation does not yet establish this material comparison.
        evidence_ids:
        - decision-observed
      difficult_case_performance:
