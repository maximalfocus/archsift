      integration_burden:
        result: equivalent
        rationale: Synthetic directional comparison.
        evidence_ids:
        - decision-observed
      security_exposure:
        result: equivalent
        rationale: Synthetic directional comparison.
        evidence_ids:
        - decision-observed
      failure_impact:
        result: equivalent
        rationale: Synthetic directional comparison.
        evidence_ids:
        - decision-observed
      operability:
        result: equivalent
        rationale: Synthetic directional comparison.
        evidence_ids:
